name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mainager
          POSTGRES_PASSWORD: mainager
          POSTGRES_DB: mainager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mainager"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MAINAGER_TEST_REDIS_URL: redis://localhost:6379/0
      MAINAGER_TEST_POSTGRES_DSN: postgresql://mainager:mainager@localhost:5432/mainager

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      # Failures are echoed back as workflow annotations so the reason is visible
      # without pulling the full log, which needs a token.
      - name: Test
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest.txt || {
            echo "::error title=pytest failed::$(tail -c 3000 pytest.txt | tr '\n' ' ' | tr -s ' ')"
            exit 1
          }

      # The backend tests skip themselves when Redis or Postgres are unreachable,
      # which would let a broken adapter pass CI silently.
      - name: Confirm the backend integration tests actually ran
        run: |
          set -euo pipefail
          pytest tests/test_guard_backends.py -q --no-header | tee backend.txt
          if grep -q skipped backend.txt; then
            echo "::error::backend integration tests were skipped; Redis/Postgres unreachable"
            exit 1
          fi
