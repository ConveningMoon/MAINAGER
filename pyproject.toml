[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainager"
version = "0.1.0"
description = "Control plane between an autonomous agent and a generative API: cost, guardrails, evals."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]  # see the note on the same pin in `dev`
infra = ["redis>=5.0", "psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    # Pinned below 2.0: that release renames the SDK surface the proxy is written
    # against (inputSchema -> input_schema, isError -> is_error,
    # streamablehttp_client -> streamable_http_client) and re-generics Server.
    # The wire protocol is unchanged; this is an SDK rename, so the pin buys time
    # rather than papering over a real incompatibility.
    "mcp>=1.2,<2",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
mainager = "mainager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mainager"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "RUF001",  # ambiguous unicode in strings: Cyrillic is expected here
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
files = ["mainager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
